name: sva_ui
description: Theme tokens, shared widgets and illustrations for Sva.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  alchemist: ^0.14.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - fonts/OFL-Fraunces.txt
    - fonts/OFL-Inter.txt
  fonts:
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter.ttf
